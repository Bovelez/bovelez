name: Test

on:
  pull_request:
    branches:
      - main
      - dev
      - master

jobs:
  run-jest-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v3

      - name: Set up NodeJS
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Copy env
        run: cp .env.example .env

      - name: Set DATABASE_URL for tests
        run: echo "DATABASE_URL=postgresql://postgres:password@localhost:5432/app" >> $GITHUB_ENV

      - name: Run docker-compose
        uses: hoverkraft-tech/compose-action@v2.0.1
        with:
          compose-file: ../docker-compose.yml
          up-flags: -d

      - name: Run migrations
        run: npm run db:migrate:integration

      - name: Run unit tests
        run: npm test -- --ci --runInBand

      - name: Run e2e tests
        run: npx dotenv -e .env.test -- jest --config ./test/jest-e2e.json --runInBand

      - name: Stop docker-compose
        if: always()
        uses: hoverkraft-tech/compose-action@v2.0.1
        with:
          compose-file: ../docker-compose.yml
          down-flags: -v