name: CI

on:
  push:
  pull_request:
    branches:
      - main
      - dev

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect changed areas
        id: filter
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"

            if [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
              BASE="$(git rev-list --max-parents=0 "$HEAD")"
            fi
          fi

          changed_files="$(git diff --name-only "$BASE" "$HEAD")"
          printf '%s\n' "$changed_files"

          backend=false
          frontend=false

          shared_pattern='docker-compose\.yml|package\.json|package-lock\.json|\.github/workflows/'

          if printf '%s\n' "$changed_files" | grep -Eq "^(backend/|$shared_pattern)"; then
            backend=true
          fi

          if printf '%s\n' "$changed_files" | grep -Eq "^(frontend/|$shared_pattern)"; then
            frontend=true
          fi

          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Copy .env.example to .env
        run: cp .env.example .env

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Start integration test DB
        run: npm run integration:docker:up

      - name: Run DB migrations
        run: npm run db:migrate:integration

      - name: Run unit tests
        run: npm run test -- --ci --runInBand --passWithNoTests

      - name: Run integration tests
        run: npx dotenv -e .env.test -- jest --config ./test/jest-int.json --runInBand

      - name: Stop integration test DB
        if: always()
        run: npm run integration:docker:down
