name: Backend CI

on:
  pull_request:
    branches:
      - main
      - dev
      - master
    paths:
      - 'backend/**'

jobs:
  run-jest-tests:
    name: Jest Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v3

      - name: Set up NodeJS
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Copy .env.example to .env
        run: cp .env.example .env

      - name: Set DATABASE_URL
        run: echo "DATABASE_URL=postgresql://postgres:password@database:5432/app" >> $GITHUB_ENV

      - name: Run docker-compose
        uses: hoverkraft-tech/compose-action@v2.0.1
        with:
          compose-file: ./backend/docker-compose.yml
          up-flags: -d

      - name: Prisma Generate
        run: npx prisma generate

      - name: Run DB migrations
        run: npm run db:migrate:integration

      - name: Run Jest Tests
        run: npm run test -- --ci --runInBand

      - name: Run Integration Tests
        run: npx dotenv -e .env.test -- jest --config ./test/jest-int.json --runInBand

      - name: Stop docker-compose
        if: always()
        uses: hoverkraft-tech/compose-action@v2.0.1
        with:
          compose-file: ./backend/docker-compose.yml
          down-flags: -v