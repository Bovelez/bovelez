name: Test

on:
  pull_request:
    branches:
      - main
      - dev
      - master

jobs:
  run-jest-tests:
    name: Jest Tests
    runs-on: ubuntu-latest

    steps:
      # Checkout del código
      - uses: actions/checkout@v3
        with:
          persist-credentials: false

      # Configurar git para HTTP
      - name: Reconfigure git to use HTTP authentication
        run: git config --global url."https://github.com/".insteadOf ssh://git@github.com/

      # NodeJS
      - name: Set up NodeJS
        uses: actions/setup-node@v3
        with:
          node-version: 20

      # Instalar dependencias
      - name: Install dependencies
        run: npm ci

      # Copiar .env
      - name: Copy .env.example to .env
        run: cp backend/.env.example backend/.env

      # Setear DATABASE_URL para tests
      - name: Set DATABASE_URL for tests
        run: echo "DATABASE_URL=postgresql://postgres:password@localhost:5432/app" >> $GITHUB_ENV

      # Levantar contenedores con Docker Compose
      - name: Run docker-compose
        uses: hoverkraft-tech/compose-action@v2.0.1
        with:
          compose-file: ./docker-compose.yml
          up-flags: -d


      # Migraciones
      - name: Run DB migrations
        run: npm run db:migrate:integration

      # Tests unitarios
      - name: Run Jest Tests
        run: npm run test -- --ci --runInBand

      # Tests E2E
      - name: Run E2E Tests
        run: npx dotenv -e .env.test -- jest --config ./test/jest-e2e.json --runInBand

      # Limpiar contenedores
      - name: Stop docker-compose
        if: always()
        uses: hoverkraft-tech/compose-action@v2.0.1
        with:
          compose-file: ./docker-compose.yml
          down-flags: -v
