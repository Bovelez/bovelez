name: Test

on:
  pull_request:
    branches:
      - main
      - dev
      - master

jobs:
  run-jest-tests:
    name: Jest Tests
    runs-on: ubuntu-latest

    steps:
      # Checkout del código
      - uses: actions/checkout@v3
        with:
          persist-credentials: false

      # Configurar git para HTTP
      - name: Reconfigure git to use HTTP authentication
        run: git config --global url."https://github.com/".insteadOf ssh://git@github.com/

      # NodeJS
      - name: Set up NodeJS
        uses: actions/setup-node@v3
        with:
          node-version: 20

      # Instalar dependencias
      - name: Install dependencies
        working-directory: backend
        run: npm ci

      # Copiar .env
      - name: Copy .env.example to .env
        working-directory: backend
        run: cp .env.example .env

      # Setear variables de entorno para Docker Compose y tests
      - name: Set env vars for Docker Compose and tests
        run: |
          echo "POSTGRES_DB=app" >> $GITHUB_ENV
          echo "POSTGRES_USER=postgres" >> $GITHUB_ENV
          echo "POSTGRES_PASSWORD=password" >> $GITHUB_ENV
          echo "DATABASE_URL=postgresql://postgres:password@localhost:5432/app" >> $GITHUB_ENV

      # Levantar solo los contenedores de base de datos (no el servicio dev)
      - name: Run docker-compose
        uses: hoverkraft-tech/compose-action@v2.0.1
        with:
          compose-file: ./backend/docker-compose.yml
          up-flags: -d
          services: |
            database
            integration-test-db


      # Migraciones
      - name: Run DB migrations
        working-directory: backend
        run: npm run db:migrate:integration

      # Tests unitarios
      - name: Run Jest Tests
        working-directory: backend
        run: npm run test -- --ci --runInBand

      # Tests E2E
      - name: Run E2E Tests
        working-directory: backend
        run: npx dotenv -e .env.test -- jest --config ./test/jest-e2e.json --runInBand

      # Limpiar contenedores
      - name: Stop docker-compose
        if: always()
        uses: hoverkraft-tech/compose-action@v2.0.1
        with:
          compose-file: ./backend/docker-compose.yml
          down-flags: -v
          services: |
            database
            integration-test-db
