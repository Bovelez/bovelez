services:
  e2e-db:
    image: postgres:alpine
    container_name: mobile-e2e-db
    environment:
      - POSTGRES_DB=tests
      - POSTGRES_USER=prisma
      - POSTGRES_PASSWORD=prisma
      - TZ=America/Argentina/Buenos_Aires
    ports:
      - '15434:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U prisma -d tests']
      interval: 1s
      timeout: 1s
      retries: 15

  price-service:
    build:
      context: ./price-service
      dockerfile: Dockerfile
    container_name: mobile-e2e-price-service
    ports:
      - '18000:8000'
    healthcheck:
      test: ['CMD', 'python', '-c', 'import urllib.request; urllib.request.urlopen("http://localhost:8000/health")']
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    container_name: mobile-e2e-server
    tty: true
    environment:
      - NODE_ENV=test
      - DATABASE_URL=postgresql://prisma:prisma@e2e-db/tests
      - PORT=8080
      - JWT_SECRET=secret
      - JWT_EXPIRES=3600s
      - PRICE_SERVICE_URL=http://price-service:8000
      - SPY_TICKERS=AAPL,MSFT,TSLA
      - TZ=America/Argentina/Buenos_Aires
    ports:
      - '18080:8080'
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      e2e-db:
        condition: service_healthy
      price-service:
        condition: service_healthy

  front-mobile:
    build:
      context: ./front-mobile
      dockerfile: Dockerfile
      target: dev
    container_name: mobile-e2e-front-mobile
    tty: true
    environment:
      - VITE_API_URL=/api
      - VITE_API_PROXY_TARGET=http://backend:8080
      - CHOKIDAR_USEPOLLING=true
    ports:
      - '15174:5174'
    volumes:
      - ./front-mobile:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_started
